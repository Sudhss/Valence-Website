<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Keystroke cost at 50,000 lines: 30.3 ms before V3, 3.57 ms worst case and 19 microseconds typical in V3">
